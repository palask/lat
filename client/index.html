<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalAreaText</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>

<body>
    <main>
        <div class="flex-row-multiple">
            <h1>LAT - LocalAreaText</h1>
            <p id="connectionStatus"></p>
        </div>
        <textarea id="inputbox" class="textbox" autofocus spellcheck="false"></textarea>
        <div id="previewbox" class="textbox" hidden></div>
        <div class="flex-row-single">
            <input type="checkbox" id="edit-toggle" checked>
            <label for="edit-toggle">Edit</label>
        </div>
    </main>
    <script src="script.ts" defer></script>
</body>

</html>
